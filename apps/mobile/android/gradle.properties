# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# React Native New Architecture (Fabric + TurboModules) is required for V1.
newArchEnabled=true

# Hermes is the only supported JS engine.
hermesEnabled=true

# Edge-to-edge is mandatory on Android 15+ and opt-in below it.
edgeToEdgeEnabled=true

# R8 full mode for release builds.
android.enableR8.fullMode=true

# AGP 9 compatibility flags required by the React Native Gradle plugin.
android.builtInKotlin=false
android.newDsl=false

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

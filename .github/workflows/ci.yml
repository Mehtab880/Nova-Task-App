name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '10.34.7'
  JAVA_VERSION: '21'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.1.12297006'
  ANDROID_CMAKE: '3.22.1'

jobs:
  quality:
    name: Typecheck, lint, tests, fonts, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Jest
        run: pnpm test:ci

      - name: Font check
        run: pnpm check:fonts

      - name: Android configuration audit
        run: pnpm check:android-config

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A license is only required for organization-owned repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  android:
    name: Android unit tests + debug/staging/release assembly
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The ubuntu-latest image ships the Android SDK. Use it directly instead
      # of a third-party setup action, then install exactly the packages the
      # build needs.
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 5 -path '*/cmdline-tools/*/bin/sdkmanager' -type f -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 3 -type d -print -quit || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.android"
          # `yes` exits with SIGPIPE once sdkmanager stops reading, so pipefail
          # must be off for the licence prompt.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Assemble dev debug
        working-directory: apps/mobile/android
        run: ./gradlew assembleDevDebug --no-daemon --stacktrace

      - name: Android unit tests (dev debug)
        working-directory: apps/mobile/android
        run: ./gradlew testDevDebugUnitTest --no-daemon --stacktrace

      - name: Assemble staging debug
        working-directory: apps/mobile/android
        run: ./gradlew assembleStagingDebug --no-daemon --stacktrace

      - name: Assemble prod release
        working-directory: apps/mobile/android
        run: ./gradlew assembleProdRelease --no-daemon --stacktrace

      - name: Verify APK targetSdk is 36
        run: >-
          node tools/verify-target-sdk.mjs
          apps/mobile/android/app/build/outputs/apk/prod/release/app-prod-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nova-task-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/mobile/android/app/build/outputs/apk/dev/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/staging/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/prod/release/*.apk
